version: "3.8"

services:
    postgres:
        image: postgres:16-alpine
        container_name: oni-builders-postgres-dev
        ports:
            - "5432:5432"
        environment:
            POSTGRES_USER: admin
            POSTGRES_PASSWORD: root
            POSTGRES_DB: oni-builder
        volumes:
            - postgres_data:/var/lib/postgresql/data
        networks:
            - oni-builders-network
        healthcheck:
            test: ["CMD-SHELL", "pg_isready -U admin -d oni-builder"]
            interval: 10s
            timeout: 5s
            retries: 5

    # Backend server in development mode
    server:
        build:
            context: .
            dockerfile: Dockerfile
        container_name: oni-builders-server-dev
        ports:
            - "3003:3003"
        environment:
            - NODE_ENV=development
            - DATABASE_URL=postgresql://admin:root@postgres:5432/oni-builder?schema=public
        volumes:
            - .:/app
            - ../shared:/shared # Mount shared directory
            - ../data:/data # Mount data directory for seed files
            - ../tsconfig.json:/tsconfig.json # Mount root tsconfig.json
            - /app/node_modules
        command: sh -c "npm run dev"
        depends_on:
            postgres:
                condition: service_healthy
        networks:
            - oni-builders-network

networks:
    oni-builders-network:
        driver: bridge

volumes:
    postgres_data:
